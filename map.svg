<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="1000" height="1000" fill="#1a2a1a"/>
  
  <!-- Река (диагональ) -->
  <line x1="0" y1="0" x2="1000" y2="1000" stroke="#1c4a78" stroke-width="70" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="1000" y2="1000" stroke="#2a6aa0" stroke-width="15" stroke-linecap="round"/>
  
  <!-- Линии -->
  <path d="M 100,900 L 100,100 L 900,100" stroke="#5a4a2c" stroke-width="45" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100,900 L 900,900 L 900,100" stroke="#5a4a2c" stroke-width="45" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100,900 L 900,100" stroke="#5a4a2c" stroke-width="45" fill="none" stroke-linecap="round"/>
  
  <!-- Башни Radiant (зелёные) -->
  <rect x="60" y="700" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="60" y="500" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="60" y="300" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="280" y="880" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="480" y="880" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="700" y="880" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="220" y="740" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="360" y="600" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  <rect x="440" y="520" width="40" height="40" fill="#3fae4a" stroke="#8fd897" stroke-width="3"/>
  
  <!-- Башни Dire (красные) -->
  <rect x="900" y="260" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="900" y="460" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="900" y="660" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="680" y="80" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="480" y="80" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="260" y="80" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="740" y="220" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="600" y="360" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  <rect x="520" y="440" width="40" height="40" fill="#e04338" stroke="#f2a09a" stroke-width="3"/>
  
  <!-- Базы -->
  <rect x="40" y="880" width="80" height="80" fill="#1b5e20" stroke="#4caf50" stroke-width="4"/>
  <rect x="880" y="40" width="80" height="80" fill="#b71c1c" stroke="#f44336" stroke-width="4"/>
  
  <!-- Рошан -->
  <circle cx="600" cy="400" r="50" fill="#4a1a6a" stroke="#9c27b0" stroke-width="4"/>
  
  <!-- Руны -->
  <circle cx="380" cy="380" r="25" fill="#2196f3"/>
  <circle cx="620" cy="620" r="25" fill="#2196f3"/>
  
  <!-- Джунгли кемпы -->
  <circle cx="300" cy="700" r="40" fill="#0c1c0c"/>
  <circle cx="200" cy="800" r="40" fill="#0c1c0c"/>
  <circle cx="400" cy="820" r="40" fill="#0c1c0c"/>
  <circle cx="700" cy="300" r="40" fill="#0c1c0c"/>
  <circle cx="800" cy="200" r="40" fill="#0c1c0c"/>
  <circle cx="600" cy="180" r="40" fill="#0c1c0c"/>
  
  <!-- Подписи -->
  <text x="500" y="50" font-size="40" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="Courier New">TOP LANE</text>
  <text x="500" y="500" font-size="40" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="Courier New">MID</text>
  <text x="500" y="970" font-size="40" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="Courier New">BOT LANE</text>
</svg>
